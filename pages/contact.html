    <link rel="icon" type="image/png" href="../favicon.png?v=2">
    <script src="../js/assets/jquery.js"></script>
  </head>
  <body class="dark-hero">
    <div class="body-overlay"></div>
    <!-- Menu-->
    <div class="nav-container">
      <ul class="nav">
        <li><a href="../pages/portfolio-3-col.html">Portfolio</a>
        </li>
        <li><a href="../pages/about-me.html">About Me</a></li>

        <li><a href="#" class="fa fa-twitter"></a></li>
        <li><a href="#" class="fa fa-instagram"></a></li>
      </ul>-->
    </div>
    <!-- Wrapper-->
    <div id="wrapper" class="container-fluid smooth-transition">
      <!-- Header-->
      <header>
        <div class="container">
          <!-- Branding--><a href="../index.html" class="brand"> <img alt="" src="../images/vblogo.png" class="dark-brand"><img alt="" src="../images/vblogo.png" class="light-brand"></a>
          <!-- Menu-->
          <div class="menu"></div>
        </div>
      </header>
      <section class="contact-page-section">
        <div class="container">
          <div class="row">
            <div class="col-md-8 col-md-offset-2">
              <div class="contact-form-panel">
                <div class="intro">
                  <h1>Contact Me</h1>
                </div>
                <form id="contact-email-form" class="contact-email-form">
                  <div class="row">
                    <div class="col-md-6">
                      <input id="contact-name" name="name" placeholder="Your name" required type="text" class="form-control">
                    </div>
                    <div class="col-md-6">
                      <input id="contact-email" name="email" placeholder="Your email" required type="email" class="form-control">
                    </div>
                    <div class="col-md-12">
                      <input id="contact-subject" name="subject" placeholder="Subject" required type="text" class="form-control">
                    </div>
                    <div class="col-md-12">
                      <button type="submit" class="btn btn-default">Send Email</button>
                    </div>
                  </div>
                </form>
                <div class="contact-social-links">
                  <h4>Social</h4>
                  <ul class="social">
                    <li><a href="#" class="fa fa-instagram" aria-label="Instagram"></a></li>
                    <li><a href="#" class="fa fa-linkedin" aria-label="LinkedIn"></a></li>
                    <li><a href="#" class="fa fa-github" aria-label="GitHub"></a></li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <!-- Footer-->
      <footer>
        <div class="container content">
          <div class="row">
            <!-- Contact info-->
            <div class="col-md-2"> 
              <p>Brooklyn, New York<br>&copy; 2026 Virginie Bonhomme. All Rights Reserved</p>
            </div>
            <div class="col-md-2"> 
              
            </div>
            <div class="col-md-8 text-right">
              <!-- Social links-->
              <ul class="social">
                <li><a href="#" class="fa fa-instagram" aria-label="Instagram"></a></li>
                <li><a href="#" class="fa fa-linkedin" aria-label="LinkedIn"></a></li>
                <li><a href="#" class="fa fa-github" aria-label="GitHub"></a></li>
              </ul>
              <!-- Copyright message-->
              
            </div>
          </div>
        </div>
      </footer>
    </div>
    <script src="../js/assets/bootstrap.js"></script>
    <script src="../js/assets/imagesloaded.pkgd.min.js"></script>
    <script src="../js/assets/validation.js"></script>
    <script src="../js/assets/masonry.pkgd.min.js"></script>
    <script src="../modules/tera-slider/tera-slider.js"></script>
    <script src="../modules/tera-lightbox/tera-lightbox.js"></script>
    <script src="../js/assets/animsition.js"></script>
    <script src="../js/functions.js"></script>
    <script>
      document.getElementById('contact-email-form').addEventListener('submit', function (event) {
        event.preventDefault();
        var name = document.getElementById('contact-name').value.trim();
        var email = document.getElementById('contact-email').value.trim();
        var subject = document.getElementById('contact-subject').value.trim();
        var body = 'Name: ' + name + '%0D%0AEmail: ' + email;
        window.location.href = 'mailto:virginiebonhomme718@gmail.com?subject=' + encodeURIComponent(subject) + '&body=' + body;
      });
    </script>
  </body>
